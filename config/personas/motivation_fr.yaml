# Persona: Motivation FR (Motivation quotidienne)
name: "Motivation FR"
id: "motivation_fr"

channel:
  name: "Motivation FR"
  handle: "@motivationfr"
  slogan: "Ta dose quotidienne de motivation"
  niche: "Motivation / Développement personnel"
  language: "fr"
  youtube_category_id: "22"
  made_for_kids: false
  default_tags:
    - "motivation"
    - "succès"
    - "discipline"
    - "mindset"
    - "objectifs"

branding:
  colors:
    primary: "#000000"
    accent: "#ff4500"
    secondary: "#ff8c00"
    text: "#ffffff"

voice:
  engine: "rtvc"
  voice_id: "motivator_fr"
  voice_sample: "voice_samples/motivation_fr.wav"
  style: "énergique, passionné, inspirant"
  speed: 1.05
  ton: "Énergique, puissant, galvanisant, inspirant et ferme."
  accent: "Français dynamique, fort impact."
  age_genre: "Homme ou femme, 30-45 ans."
  prompt_specifique: "Parle comme un coach sportif ou de vie de haut niveau, avec beaucoup de philosophie. La voix dégage une énergie inébranlable, pousse à l'action, avec des variations de volume et d'intensité pour marquer les moments clés de motivation."

script:
  storytelling:
    structure:
      - name: "Hook émotionnel"
        duration_pct: 10
        description: "Citation ou question puissante"
      - name: "Histoire"
        duration_pct: 50
        description: "Histoire inspirante (sportif, entrepreneur)"
      - name: "Leçon"
        duration_pct: 30
        description: "3 principes à appliquer"
      - name: "Call to action"
        duration_pct: 10
        description: "Passe à l'action maintenant"
  tone: "énergique, passionné, direct"

content:
  topics:
    - "Discipline quotidienne"
    - "Surmonter l'échec"
    - "Mindset de gagnant"
    - "Histoires de réussite"
  format: "short-form (1-3 min)"
  target_duration_s: 120

quality:
  min_score: 65
